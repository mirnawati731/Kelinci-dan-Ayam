     * ENGINE ILUSTRASI FOTOREALISTIK / 3D CINEMATIC REALISM (HIGH-DPI HTML5 CANVAS)

    // Helper: Gambar Lingkaran/Elips Bertekstur Halus & Pencahayaan Realistis
    function drawShadedEllipse(ctx, cx, cy, rx, ry, rot, stops) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      const grad = ctx.createRadialGradient(-rx * 0.28, -ry * 0.32, rx * 0.05, 0, 0, Math.max(rx, ry));
      stops.forEach(([offset, color]) => grad.addColorStop(offset, color));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Helper: Tekstur Helai Bulu Halus (Fur / Feather Strands)
    function drawHairStrands(ctx, cx, cy, rx, ry, count, color, alpha = 0.25, len = 7) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 0.9;
      ctx.lineCap = "round";
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const rRatio = 0.35 + ((i * 37) % 60) / 100;
        const sx = cx + Math.cos(angle) * rx * rRatio;
        const sy = cy + Math.sin(angle) * ry * rRatio;
        const dirAngle = angle + Math.sin(i) * 0.3;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(dirAngle) * len, sy + Math.sin(dirAngle) * len);
        ctx.stroke();
      }
      ctx.restore();
    }

    /**
     * RENDER AYAM JANTAN HITAM SUNGGUHAN (PHOTOREALISTIC ROOSTER)
     * Konsisten bentuk, proporsi, bulu hitam berkilau iridescent hijau-ungu,
     * jengger merah bertekstur alami, paruh keratin kuning-tanduk, dan ekspresi hidup.
     */
    function renderRealisticRooster(ctx, x, y, scale, time, mood = "happy", flip = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(flip ? -scale : scale, scale);

      // Gerak napas & mikro-ekspresi alami
      const breath = Math.sin(time * 3.2) * 1.6;
      const headBob =
        mood === "laugh" ? Math.sin(time * 12) * 3.5 :
        mood === "sad" ? 6 + Math.sin(time * 2) * 1 :
        mood === "work" ? Math.sin(time * 6) * 3 :
        Math.sin(time * 2.6 + 0.5) * 2;
      const headTilt =
        mood === "sad" ? 0.16 :
        mood === "laugh" ? -0.12 + Math.sin(time * 12) * 0.06 :
        mood === "advise" ? -0.05 : 0;

      // 1. Contact Shadow (Bayangan lembut di paving/tanah)

      shadowGrad.addColorStop(0, "rgba(15, 23, 42, 0.45)");
      shadowGrad.addColorStop(0.65, "rgba(15, 23, 42, 0.18)");
      shadowGrad.addColorStop(1, "rgba(15, 23, 42, 0)");
      ctx.fillStyle = shadowGrad;
      ctx.beginPath();
      ctx.ellipse(0, 66, 56, 13, 0, 0, Math.PI * 2);

          [0, "#1e293b"],
          [1, "#020617"]

        legGrad.addColorStop(0.5, "#f59e0b");

        ctx.strokeStyle = legGrad;

        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 14);

      const tailPlumes = [
        { cp1x: -36, cp1y: -58, cp2x: -74, cp2y: -48, ex: -68, ey: -10, w: 12, c1: "#064e3b", c2: "#020617" },
        { cp1x: -42, cp1y: -46, cp2x: -82, cp2y: -26, ex: -76, ey: 10, w: 13, c1: "#312e81", c2: "#090d16" },
        { cp1x: -38, cp1y: -30, cp2x: -76, cp2y: -4, ex: -66, ey: 24, w: 11, c1: "#0f172a", c2: "#020617" },
        { cp1x: -30, cp1y: -18, cp2x: -62, cp2y: 12, ex: -52, ey: 32, w: 10, c1: "#065f46", c2: "#020617" }
      ];
      tailPlumes.forEach((p) => {
        const tGrad = ctx.createLinearGradient(0, 0, p.ex, p.ey);
        tGrad.addColorStop(0, "#090d16");
        tGrad.addColorStop(0.55, p.c1);

        ctx.fillStyle = tGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(p.cp1x, p.cp1y, p.cp2x, p.cp2y, p.ex, p.ey);
        ctx.bezierCurveTo(p.cp2x + 12, p.cp2y + 10, p.cp1x + 8, p.cp1y + 12, -2, 10);
        ctx.closePath();
        ctx.fill();

        // Batang bulu (rachis) berkilau
        ctx.strokeStyle = "rgba(52, 211, 153, 0.28)";

        ctx.beginPath();
        ctx.moveTo(-2, 4);
        ctx.quadraticCurveTo(p.cp1x * 0.8, p.cp1y * 0.8, p.ex + 4, p.ey - 4);
        ctx.stroke();
      });
      ctx.restore();

      // 4. Badan Ayam Jantan Berotot & Berbulu Lebat
      ctx.save();
      ctx.translate(0, breath * 0.6);
      drawShadedEllipse(ctx, -2, 2, 36, 30, -0.18, [

      // Lapisan bulu dada (hackle & breast feathers)

      ctx.save();
      ctx.translate(-4, 2);
      ctx.rotate(-0.12 + (mood === "laugh" ? Math.sin(time * 14) * 0.14 : 0));
      drawShadedEllipse(ctx, 0, 0, 24, 15, 0.15, [
        [0, "#1e293b"],
        [0.5, "#090d16"],
        [1, "#020617"]
      ]);
      // Garis bulu sayap realistis
      ctx.strokeStyle = "rgba(56, 189, 248, 0.22)";
      ctx.lineWidth = 1.3;
      for (let wi = -10; wi <= 10; wi += 5) {
        ctx.beginPath();
        ctx.moveTo(-14, wi * 0.5);
        ctx.quadraticCurveTo(0, wi * 0.7 + 4, 18, wi * 0.6);
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore();

      // 5. Leher Berbulu Runcing (Hackle Feathers) & Kepala
      ctx.save();
      ctx.translate(16, -24 + headBob);
      ctx.rotate(headTilt);

      // Leher berbulu lebat
      drawShadedEllipse(ctx, -4, 4, 18, 24, -0.22, [
        [0, "#334155"],
        [0.45, "#0f172a"],
        [1, "#020617"]
      ]);
      drawHairStrands(ctx, -4, 4, 15, 20, 36, "#64748b", 0.4, 9);

      // Kepala
      drawShadedEllipse(ctx, 4, -22, 18, 16, 0, [
        [0, "#334155"],
        [0.5, "#0f172a"],
        [1, "#020617"]
      ]);

      // Jengger Merah Bertekstur Alami (Single Comb 5 Gerigi)
      const combGrad = ctx.createLinearGradient(0, -52, 0, -32);
      combGrad.addColorStop(0, "#f87171");
      combGrad.addColorStop(0.45, "#dc2626");
      combGrad.addColorStop(1, "#7f1d1d");
      ctx.fillStyle = combGrad;
      ctx.beginPath();
      ctx.moveTo(-12, -33);
      ctx.bezierCurveTo(-15, -46, -8, -50, -5, -40);
      ctx.bezierCurveTo(-3, -53, 4, -53, 5, -40);
      ctx.bezierCurveTo(8, -54, 15, -52, 14, -39);
      ctx.bezierCurveTo(18, -49, 24, -45, 19, -33);
      ctx.closePath();
      ctx.fill();
      // Bintik tekstur organik pada jengger
      ctx.fillStyle = "rgba(254, 202, 202, 0.35)";
      ctx.beginPath();
      ctx.arc(-1, -43, 1.5, 0, Math.PI * 2);
      ctx.arc(7, -44, 1.7, 0, Math.PI * 2);
      ctx.arc(14, -41, 1.3, 0, Math.PI * 2);
      ctx.fill();

      // Cuping Telinga Putih-Merah Muda & Pial Merah di Bawah Paruh
      drawShadedEllipse(ctx, -3, -17, 4.5, 5.5, 0, [
        [0, "#ffffff"],
        [1, "#cbd5e1"]
      ]);
      drawShadedEllipse(ctx, 14, -8, 6, 10, 0.1, [
        [0, "#ef4444"],
        [0.7, "#b91c1c"],
        [1, "#7f1d1d"]
      ]);

      // Paruh Keratin Kuning-Tanduk Realistis
      const beakGrad = ctx.createLinearGradient(18, -26, 40, -16);
      beakGrad.addColorStop(0, "#fef08a");
      beakGrad.addColorStop(0.5, "#eab308");
      beakGrad.addColorStop(1, "#a16207");
      ctx.fillStyle = beakGrad;
      // Paruh atas melengkung tajam
      ctx.beginPath();
      ctx.moveTo(18, -25);
      ctx.quadraticCurveTo(32, -26, 41, -18);
      ctx.lineTo(18, -18);
      ctx.closePath();
      ctx.fill();
      // Lubang hidung kecil
      ctx.fillStyle = "#713f12";
      ctx.beginPath();
      ctx.ellipse(23, -22, 1.8, 0.9, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Paruh bawah (terbuka saat tertawa atau berbicara)
      const jawOpen = mood === "laugh" ? 5 : 0;
      ctx.fillStyle = "#ca8a04";
      ctx.beginPath();
      ctx.moveTo(18, -18);
      ctx.lineTo(36, -17 + jawOpen);
      ctx.lineTo(18, -13 + jawOpen * 0.6);
      ctx.closePath();
      ctx.fill();

      // Mata Burung Realistis (Iris Jingga-Cokelat + Pupil Hitam + Catchlight Tajam)
      const isBlinking = Math.sin(time * 1.7) > 0.97;

        ctx.strokeStyle = "#f8fafc";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(8, -22, 5, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      } else if (isBlinking) {
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(3, -22);
        ctx.lineTo(13, -22);
        ctx.stroke();
      } else {
        // Iris jingga keemasan alami ayam
        drawShadedEllipse(ctx, 8, -22, 5.5, 5.5, 0, [
          [0, "#fbbf24"],
          [0.7, "#d97706"],
          [1, "#78350f"]
        ]);
        // Pupil hitam
        ctx.fillStyle = "#020617";
        ctx.beginPath();
        ctx.arc(8.5, -22, 2.8, 0, Math.PI * 2);
        ctx.fill();
        // Catchlight pantulan langit
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(9.8, -23.5, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Alis ekspresi sedih / menyesal

        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(3, -28);
        ctx.lineTo(13, -30);
        ctx.stroke();

        ctx.arc(12, -14, 2.2, 0, Math.PI * 2);

        ctx.translate(18, 4);

        tGrad.addColorStop(0, "#0284c7");
        tGrad.addColorStop(0.5, "#38bdf8");
        tGrad.addColorStop(1, "#0369a1");
        ctx.fillStyle = tGrad;
        ctx.beginPath();
        ctx.roundRect(-7, -14, 14, 28, 4);
        ctx.fill();
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(-5, -18, 10, 4);
        ctx.restore();
      }

      ctx.restore();
    }

    /**

        ]);

        ]);

      drawShadedEllipse(ctx, 0, -28, 9, 32, 0, [
        [0, "#ffffff"],

        [1, "#cbd5e1"]
      ]);
      // Bagian dalam telinga merah muda hangat (subsurface scattering)

        [0, "#fbcfe8"],
        [0.6, "#f472b6"],

      ctx.translate(2, -16);
      ctx.rotate(-0.04 + earTwitch);

        [0.85, "#f1f5f9"],
        [1, "#cbd5e1"]
      ]);
      drawShadedEllipse(ctx, 1.5, -28, 5, 25, 0, [

      // Pembuluh darah tipis halus di dalam telinga

        [0.9, "#e2e8f0"],

      ]);
      // Moncong pipi (muzzle)
      drawShadedEllipse(ctx, 19, 4, 10, 8.5, 0, [
        [0, "#ffffff"],
        [0.85, "#f1f5f9"],
        [1, "#cbd5e1"]
      ]);
      drawHairStrands(ctx, 4, -2, 20, 17, 45, "#94a3b8", 0.24, 5);

      // Mata Kelinci Besar Berkilau Realistis
      const isBlinking = Math.sin(time * 1.9 + 1.2) > 0.975;
      if (isBlinking) {
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(8, -5);
        ctx.lineTo(17, -5);
        ctx.stroke();
      } else {
        drawShadedEllipse(ctx, 13, -5, 5.8, 6.2, -0.08, [
          [0, "#451a03"],
          [0.6, "#1e1b18"],
          [1, "#020617"]
        ]);
        // Catchlight ganda tajam (langit + pantulan rumput)
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(14.5, -7, 1.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.beginPath();
        ctx.arc(11.5, -3.5, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }

      // Alis sedih saat sekolah banjir
      if (mood === "sad") {
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(8, -12);
        ctx.lineTo(17, -14);
        ctx.stroke();
      }

      // Hidung Merah Muda Bergerak Halus
      ctx.fillStyle = "#f472b6";
      ctx.beginPath();
      ctx.ellipse(27, 2 + noseTwitch * 0.4, 3.2, 2.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Mulut Kelinci (Y-shape alami)
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(27, 4.5);
      ctx.lineTo(27, 7.5);
      if (mood === "sad") {
        ctx.quadraticCurveTo(23, 6.5, 20, 8.5);
      } else {
        ctx.quadraticCurveTo(23, 9.5, 20, 7.5);
      }
      ctx.stroke();

      // Kumis Kelinci Putih Transparan Halus
      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 1;
      [
        [23, 4, 41, 1],
        [23, 6, 42, 6],
        [22, 8, 39, 11]
      ].forEach(([wx1, wy1, wx2, wy2]) => {
        ctx.beginPath();
        ctx.moveTo(wx1, wy1);
        ctx.lineTo(wx2, wy2);
        ctx.stroke();
      });

      ctx.restore(); // Tutup kepala

      // Properti Kantong Sampah Pilah Saat Gotong Royong
      if (mood === "work") {
        ctx.save();
        ctx.translate(26, 36);
        const bagGrad = ctx.createLinearGradient(-12, -12, 12, 22);
        bagGrad.addColorStop(0, "#22c55e");
        bagGrad.addColorStop(1, "#14532d");
        ctx.fillStyle = bagGrad;
        ctx.beginPath();
        ctx.moveTo(-8, -12);
        ctx.lineTo(8, -12);
        ctx.quadraticCurveTo(16, 8, 12, 24);
        ctx.quadraticCurveTo(0, 28, -12, 24);
        ctx.quadraticCurveTo(-16, 8, -8, -12);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    /**
     * RENDER LINGKUNGAN SEKOLAH SMP NEGERI SATU ATAP 3 KALIANDA YANG NYATA
     * Dilengkapi Gedung Sekolah Khas Indonesia, Paving Block, Pepohonan Rindang,
     * God Rays, Selokan Drainase Beton, dan Tempat Sampah Terpilah.
     */
    function renderPhotorealisticSchoolEnvironment(ctx, W, H, time, opts = {}) {
      const { isStorm = false, isDirty = false, isFlooded = false } = opts;

      // 1. Langit & Cahaya Atmosferik
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
      if (isStorm) {
        skyGrad.addColorStop(0, "#1e293b");
        skyGrad.addColorStop(0.55, "#475569");
        skyGrad.addColorStop(1, "#64748b");
      } else {
        skyGrad.addColorStop(0, "#0284c7");
        skyGrad.addColorStop(0.45, "#38bdf8");
        skyGrad.addColorStop(0.85, "#bae6fd");
        skyGrad.addColorStop(1, "#fef9c3");
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Matahari & Awan Cumulus Natural
      if (!isStorm) {
        const sunGrad = ctx.createRadialGradient(690, 75, 10, 690, 75, 130);
        sunGrad.addColorStop(0, "rgba(255, 255, 240, 0.95)");
        sunGrad.addColorStop(0.25, "rgba(254, 240, 138, 0.55)");
        sunGrad.addColorStop(1, "rgba(254, 240, 138, 0)");
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(690, 75, 130, 0, Math.PI * 2);
        ctx.fill();

        // Awan lembut bergerak pelan
        const cloudShift = (time * 6) % (W + 250);
        const drawCloud = (cx, cy, sc) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(sc, sc);
          const cGrad = ctx.createLinearGradient(0, -25, 0, 20);
          cGrad.addColorStop(0, "rgba(255, 255, 255, 0.92)");
          cGrad.addColorStop(1, "rgba(226, 232, 240, 0.65)");
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.arc(26, -6, 30, 0, Math.PI * 2);
          ctx.arc(54, 2, 22, 0, Math.PI * 2);
          ctx.arc(-22, 5, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        };
        drawCloud(((140 + cloudShift) % (W + 200)) - 100, 78, 1);
        drawCloud(((460 + cloudShift * 0.7) % (W + 200)) - 100, 58, 0.85);
      } else {
        // Awan badai gelap berlapis
        ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
        for (let ci = 0; ci < 9; ci++) {
          ctx.beginPath();
          ctx.arc(ci * 105 + 30, 55 + (ci % 2) * 14, 65, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Perbukitan Hijau Rajabasa / Kalianda di Kejauhan (Atmospheric Perspective)
      const hillGrad = ctx.createLinearGradient(0, 210, 0, 325);
      if (isStorm) {
        hillGrad.addColorStop(0, "#334155");
        hillGrad.addColorStop(1, "#1e293b");
      } else {
        hillGrad.addColorStop(0, "#4ade80");
        hillGrad.addColorStop(0.5, "#22c55e");
        hillGrad.addColorStop(1, "#15803d");
      }
      ctx.fillStyle = hillGrad;
      ctx.beginPath();
      ctx.moveTo(0, 285);
      ctx.bezierCurveTo(180, 200, 330, 265, 490, 225);
      ctx.bezierCurveTo(630, 190, 720, 240, W, 255);
      ctx.lineTo(W, 335);
      ctx.lineTo(0, 335);
      ctx.closePath();
      ctx.fill();

      // 3. Gedung Sekolah SMP Negeri Indonesia (Arsitektur Realistis)
      ctx.save();
      ctx.translate(135, 142);

      // Bayangan gedung
      ctx.fillStyle = "rgba(15, 23, 42, 0.2)";
      ctx.fillRect(18, 178, 494, 10);

      // Dinding bangunan putih krem & lis hijau sekolah
      const wallGrad = ctx.createLinearGradient(0, 58, 0, 180);
      wallGrad.addColorStop(0, "#ffffff");
      wallGrad.addColorStop(0.75, "#f8fafc");
      wallGrad.addColorStop(1, "#e2e8f0");
      ctx.fillStyle = wallGrad;
      ctx.fillRect(20, 58, 490, 122);

      // Lis bawah dinding warna hijau sekolah
      ctx.fillStyle = "#15803d";
      ctx.fillRect(20, 148, 490, 32);

      // Pilar teras sekolah
      ctx.fillStyle = "#cbd5e1";
      [35, 145, 255, 375, 485].forEach((px) => {
        ctx.fillRect(px, 58, 10, 122);
      });

      // Atap Genteng Tanah Liat Terakota Realistis
      const roofGrad = ctx.createLinearGradient(0, 4, 0, 62);
      roofGrad.addColorStop(0, "#ea580c");
      roofGrad.addColorStop(0.55, "#c2410c");
      roofGrad.addColorStop(1, "#7c2d12");
      ctx.fillStyle = roofGrad;
      ctx.beginPath();
      ctx.moveTo(0, 60);
      ctx.lineTo(50, 8);
      ctx.lineTo(480, 8);
      ctx.lineTo(530, 60);
      ctx.closePath();
      ctx.fill();

      // Tekstur garis genteng
      ctx.strokeStyle = "rgba(67, 20, 7, 0.28)";
      ctx.lineWidth = 1;
      for (let ry = 18; ry < 58; ry += 8) {
        ctx.beginPath();
        ctx.moveTo(10, ry);
        ctx.lineTo(520, ry);
        ctx.stroke();
      }

      // Papan Nama Sekolah Resmi
      ctx.fillStyle = "#1e3a8a";
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(130, 64, 270, 24, 4);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 10.5px 'Plus Jakarta Sans', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("SMP NEGERI SATU ATAP 3 KALIANDA", 265, 80);

      // Jendela Kaca Ruang Kelas dengan Pantulan Langit
      const winPositions = [58, 102, 168, 212, 282, 326, 398, 442];
      winPositions.forEach((wx) => {
        const wGrad = ctx.createLinearGradient(wx, 100, wx + 32, 138);
        wGrad.addColorStop(0, isStorm ? "#334155" : "#7dd3fc");
        wGrad.addColorStop(0.5, isStorm ? "#475569" : "#bae6fd");
        wGrad.addColorStop(1, "#0284c7");
        ctx.fillStyle = wGrad;
        ctx.fillRect(wx, 100, 32, 38);
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 2;
        ctx.strokeRect(wx, 100, 32, 38);
      });

      // Tiang Bendera Merah Putih Berkibar Lembut
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-26, 16);
      ctx.lineTo(-26, 182);
      ctx.stroke();
      const wave = Math.sin(time * 4) * 2.5;
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.moveTo(-24, 20);
      ctx.quadraticCurveTo(0, 20 + wave, 24, 22);
      ctx.lineTo(24, 35);
      ctx.quadraticCurveTo(0, 33 + wave, -24, 33);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(-24, 33);
      ctx.quadraticCurveTo(0, 33 + wave, 24, 35);
      ctx.lineTo(24, 48);
      ctx.quadraticCurveTo(0, 46 + wave, -24, 46);
      ctx.fill();

      ctx.restore(); // Tutup Gedung Sekolah

      // 4. Halaman Sekolah: Rumput Hijau & Lapangan Paving Block Realistis
      const groundGrad = ctx.createLinearGradient(0, 318, 0, H);
      if (isDirty) {
        groundGrad.addColorStop(0, "#65a30d");
        groundGrad.addColorStop(0.5, "#4d7c0f");
        groundGrad.addColorStop(1, "#3f6212");
      } else {
        groundGrad.addColorStop(0, "#22c55e");
        groundGrad.addColorStop(0.45, "#16a34a");
        groundGrad.addColorStop(1, "#14532d");
      }
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, 318, W, H - 318);

      // Lapangan Paving Block Perspektif di Tengah Halaman
      const pavingGrad = ctx.createLinearGradient(0, 320, 0, 458);
      pavingGrad.addColorStop(0, "#cbd5e1");
      pavingGrad.addColorStop(0.5, "#94a3b8");
      pavingGrad.addColorStop(1, "#64748b");
      ctx.fillStyle = pavingGrad;
      ctx.beginPath();
      ctx.moveTo(220, 322);
      ctx.lineTo(580, 322);
      ctx.lineTo(690, 456);
      ctx.lineTo(110, 456);
      ctx.closePath();
      ctx.fill();

      // Garis-garis nat paving block halus
      ctx.strokeStyle = "rgba(30, 41, 59, 0.22)";
      ctx.lineWidth = 1;
      for (let py = 336; py < 454; py += 16) {
        ctx.beginPath();
        ctx.moveTo(110, py);
        ctx.lineTo(690, py);
        ctx.stroke();
      }

      // 5. Pepohonan Rindang di Kiri & Kanan dengan Tekstur Daun Berlapis
      const drawRealisticTree = (tx, ty, scaleTree) => {
        ctx.save();
        ctx.translate(tx, ty);
        ctx.scale(scaleTree, scaleTree);
        // Batang kayu bertekstur
        const trunkGrad = ctx.createLinearGradient(-12, 0, 12, 0);
        trunkGrad.addColorStop(0, "#451a03");
        trunkGrad.addColorStop(0.5, "#78350f");
        trunkGrad.addColorStop(1, "#290d02");
        ctx.fillStyle = trunkGrad;
        ctx.fillRect(-10, -20, 20, 110);

        // Tajuk daun berlapis (gelap di bawah, terang terkena matahari di atas)
        const foliageClusters = [
          { x: -28, y: -32, r: 38, c1: "#166534", c2: "#052e16" },
          { x: 28, y: -30, r: 38, c1: "#15803d", c2: "#052e16" },
          { x: 0, y: -56, r: 48, c1: isDirty ? "#84cc16" : "#4ade80", c2: "#14532d" },
          { x: -16, y: -44, r: 34, c1: isDirty ? "#a3e635" : "#22c55e", c2: "#15803d" },
          { x: 18, y: -46, r: 34, c1: isDirty ? "#84cc16" : "#22c55e", c2: "#166534" }
        ];
        foliageClusters.forEach((fc) => {
          drawShadedEllipse(ctx, fc.x, fc.y, fc.r, fc.r * 0.85, 0, [
            [0, fc.c1],
            [1, fc.c2]
          ]);
        });
        ctx.restore();
      };
      drawRealisticTree(62, 245, 1.05);
      drawRealisticTree(738, 242, 1.1);

      // 6. Taman Bunga Tropis di Sisi Halaman
      const drawFlowerBed = (bx, by, wilted) => {
        ctx.save();
        ctx.translate(bx, by);
        // Pembatas batu taman & tanah gembur
        ctx.fillStyle = "#57534e";
        ctx.beginPath();
        ctx.ellipse(0, 14, 68, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#451a03";
        ctx.beginPath();
        ctx.ellipse(0, 12, 62, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        const flowerPalette = wilted ? ["#78350f", "#92400e", "#713f12"] : ["#f43f5e", "#facc15", "#ec4899", "#fb923c"];
        [-42, -16, 12, 40].forEach((fx, idx) => {
          const bend = wilted ? 8 : Math.sin(time * 2 + idx) * 1.5;
          ctx.strokeStyle = "#15803d";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(fx, 10);
          ctx.quadraticCurveTo(fx + bend * 0.5, -2, fx + bend, -12 + (wilted ? 8 : 0));
          ctx.stroke();

          ctx.fillStyle = flowerPalette[idx % flowerPalette.length];
          ctx.beginPath();
          ctx.arc(fx + bend, -13 + (wilted ? 8 : 0), 7.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.arc(fx + bend, -13 + (wilted ? 8 : 0), 3, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      };
      drawFlowerBed(115, 382, isDirty);
      drawFlowerBed(685, 382, isDirty);

      // 7. Selokan Drainase Beton Realistis di Bagian Depan
      ctx.fillStyle = "#475569";
      ctx.fillRect(0, 454, W, 46);
      ctx.fillStyle = "#94a3b8";
      ctx.fillRect(0, 454, W, 5);

      const drainWaterGrad = ctx.createLinearGradient(0, 462, 0, 496);
      if (isDirty || isFlooded) {
        drainWaterGrad.addColorStop(0, "#78350f");
        drainWaterGrad.addColorStop(1, "#451a03");
      } else {
        drainWaterGrad.addColorStop(0, "#38bdf8");
        drainWaterGrad.addColorStop(0.5, "#0284c7");
        drainWaterGrad.addColorStop(1, "#0369a1");
      }
      ctx.fillStyle = drainWaterGrad;
      ctx.fillRect(0, 462, W, 34);

      // Riak aliran air selokan jika bersih
      if (!isDirty && !isFlooded) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
        ctx.lineWidth = 1.5;
        const flowOffset = (time * 45) % 80;
        for (let wx = -80 + flowOffset; wx < W; wx += 80) {
          ctx.beginPath();
          ctx.moveTo(wx, 474);
          ctx.quadraticCurveTo(wx + 20, 470, wx + 40, 474);
          ctx.stroke();
        }
      }

      // 8. God Rays (Sinar Matahari Menembus Pepohonan Saat Cerah)
      if (!isStorm && !isDirty) {
        ctx.save();
        const rayGrad = ctx.createLinearGradient(680, 60, 260, 420);
        rayGrad.addColorStop(0, "rgba(254, 249, 195, 0.24)");
        rayGrad.addColorStop(1, "rgba(254, 249, 195, 0)");
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(650, 50);
        ctx.lineTo(740, 90);
        ctx.lineTo(390, 440);
        ctx.lineTo(180, 440);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // Helper: Render Sepasang Tempat Sampah Terpilah 3D Realistis
    function renderRealisticTrashBins(ctx, x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Bayangan tempat sampah
      ctx.fillStyle = "rgba(15, 23, 42, 0.3)";
      ctx.beginPath();
      ctx.ellipse(0, 12, 56, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const drawBin = (bx, cLight, cMid, cDark, label, sub) => {
        const bGrad = ctx.createLinearGradient(bx - 21, 0, bx + 21, 0);
        bGrad.addColorStop(0, cLight);
        bGrad.addColorStop(0.5, cMid);
        bGrad.addColorStop(1, cDark);
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.roundRect(bx - 21, -46, 42, 56, 5);
        ctx.fill();

        // Tutup melengkung
        ctx.fillStyle = cDark;
        ctx.beginPath();
        ctx.roundRect(bx - 23, -53, 46, 9, 4);
        ctx.fill();

        // Label putih kontras
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fillRect(bx - 18, -22, 36, 16);
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 6.5px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(label, bx, -14);
        ctx.font = "600 5.5px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText(sub, bx, -8);
      };

      drawBin(-26, "#4ade80", "#16a34a", "#14532d", "ORGANIK", "Daun & Sisa");
      drawBin(26, "#fde047", "#eab308", "#854d0e", "ANORGANIK", "Plastik/Kaleng");
      ctx.restore();
    }

    // Helper: Render Sampah Realistis Berserakan di Halaman & Selokan
    function renderRealisticTrashClutter(ctx) {
      const debris = [
        { x: 165, y: 382, rot: -0.3, type: "bottle" },
        { x: 245, y: 412, rot: 0.4, type: "wrapper" },
        { x: 325, y: 374, rot: 0.2, type: "cup" },
        { x: 475, y: 396, rot: -0.35, type: "wrapper" },
        { x: 555, y: 418, rot: 0.5, type: "bottle" },
        { x: 615, y: 376, rot: -0.2, type: "cup" },
        // Menyumbat selokan drainase
        { x: 210, y: 475, rot: 0.15, type: "wrapper" },
        { x: 375, y: 478, rot: -0.1, type: "bottle" },
        { x: 515, y: 474, rot: 0.2, type: "cup" }
      ];
      debris.forEach((d) => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        if (d.type === "bottle") {
          ctx.fillStyle = "rgba(186, 230, 253, 0.85)";
          ctx.strokeStyle = "#0284c7";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(-11, -5, 22, 10, 3);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#2563eb";
          ctx.fillRect(11, -3, 4, 6);
        } else if (d.type === "wrapper") {
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.roundRect(-12, -7, 24, 14, 2);
          ctx.fill();
          ctx.fillStyle = "#facc15";
          ctx.fillRect(-7, -3, 14, 6);
        } else {
          ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
          ctx.beginPath();
          ctx.moveTo(-7, -8);
          ctx.lineTo(7, -8);
          ctx.lineTo(5, 8);
          ctx.lineTo(-5, 8);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#ec4899";
          ctx.fillRect(-6, -2, 12, 4);
        }
        ctx.restore();
      });
    }

    // Helper: Balon Dialog Sinematik Halus
    function renderSpeechBubble(ctx, cx, cy, lines, borderColor = "#0284c7", bgColor = "rgba(255,255,255,0.95)") {
      ctx.save();
      const boxW = 235;
      const boxH = lines.length * 16 + 18;
      ctx.shadowColor = "rgba(15, 23, 42, 0.2)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH, 14);
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillStyle = "#0f172a";
      ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
      ctx.textAlign = "center";
      lines.forEach((line, i) => {
        ctx.fillText(line, cx, cy - boxH / 2 + 18 + i * 16);
      });
      ctx.restore();
    }

    /**
     * RENDER ADEGAN LENGKAP PER HALAMAN PADA CANVAS FOTOREALISTIK
     */
    function drawSceneFrame(canvas, scene, time) {
      if (!canvas) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const targetW = Math.max(400, Math.round(rect.width * dpr));
      const targetH = Math.max(250, Math.round(rect.height * dpr));

      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }

      const ctx = canvas.getContext("2d");
      ctx.save();
      // Skala koordinat virtual 800x500 agar responsif penuh tanpa distorsi
      const scaleX = canvas.width / 800;
      const scaleY = canvas.height / 500;
      ctx.scale(scaleX, scaleY);

      switch (scene) {
        case "cover":
        case "beautiful_school":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 610, 355, 0.92);
          renderRealisticRooster(ctx, 325, 378, 1.18, time, "happy", false);
          renderRealisticRabbit(ctx, 465, 380, 1.15, time, "happy", true);
          break;

        case "littering":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          // Stan Kantin Sekolah Indonesia Realistis
          ctx.save();
          ctx.translate(42, 245);
          ctx.fillStyle = "#fef3c7";
          ctx.fillRect(0, 35, 145, 92);
          ctx.fillStyle = "#b91c1c";
          ctx.beginPath();
          ctx.moveTo(-8, 38);
          ctx.lineTo(72, 6);
          ctx.lineTo(153, 38);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#facc15";
          ctx.fillRect(25, 18, 95, 17);
          ctx.fillStyle = "#451a03";
          ctx.font = "800 9.5px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("KANTIN SEKOLAH", 72, 30);
          ctx.restore();

          renderRealisticTrashBins(ctx, 625, 358, 1.0);
          renderRealisticRooster(ctx, 340, 378, 1.15, time, "happy", false);
          // Bungkus plastik jatuh ke paving
          ctx.save();
          ctx.translate(428, 412 + Math.sin(time * 4) * 2);
          ctx.rotate(0.35);
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.roundRect(-14, -8, 28, 16, 3);
          ctx.fill();
          ctx.fillStyle = "#facc15";
          ctx.fillRect(-8, -3, 16, 6);
          ctx.restore();
          break;

        case "advising":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 645, 358, 0.95);
          // Bungkus sampah di tanah
          ctx.save();
          ctx.translate(390, 425);
          ctx.rotate(0.2);
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(-13, -7, 26, 14);
          ctx.restore();

          renderRealisticRooster(ctx, 290, 378, 1.15, time, "laugh", false);
          renderRealisticRabbit(ctx, 495, 380, 1.15, time, "advise", true);
          renderSpeechBubble(ctx, 265, 245, ["“Haha, cuma satu bungkus", "kecil kok, Kelinci!”"], "#eab308", "#fefce8");
          renderSpeechBubble(ctx, 520, 235, ["“Buang sampahnya ke tempat", "sampah ya, Ayam Hitam!”"], "#0284c7", "#f0f9ff");
          break;

        case "dirty_school":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: true });
          renderRealisticTrashClutter(ctx);
          renderRealisticRooster(ctx, 310, 382, 1.08, time, "sad", false);
          renderRealisticRabbit(ctx, 480, 382, 1.08, time, "sad", true);
          break;

        case "flood_rain":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: true, isDirty: true, isFlooded: true });
          renderRealisticTrashClutter(ctx);

          // Genangan banjir berlumpur dengan pantulan cahaya riak air
          const floodGrad = ctx.createRadialGradient(400, 412, 30, 400, 412, 360);
          floodGrad.addColorStop(0, "rgba(14, 116, 144, 0.78)");
          floodGrad.addColorStop(0.65, "rgba(51, 65, 85, 0.72)");
          floodGrad.addColorStop(1, "rgba(30, 41, 59, 0.25)");
          ctx.fillStyle = floodGrad;
          ctx.beginPath();
          ctx.ellipse(400, 415, 365, 56, 0, 0, Math.PI * 2);
          ctx.fill();

          // Riak lingkaran air hujan jatuh ke genangan
          ctx.strokeStyle = "rgba(186, 230, 253, 0.5)";
          ctx.lineWidth = 1.3;
          for (let ri = 0; ri < 5; ri++) {
            const rProgress = ((time * 1.4 + ri * 0.22) % 1);
            ctx.globalAlpha = 1 - rProgress;
            ctx.beginPath();
            ctx.ellipse(220 + ri * 95, 412 + (ri % 2) * 14, 6 + rProgress * 28, 2 + rProgress * 8, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;

          renderRealisticRooster(ctx, 300, 372, 1.08, time, "sad", false);
          renderRealisticRabbit(ctx, 490, 375, 1.08, time, "sad", true);

          // Tetesan Hujan Deras Sinematik
          ctx.strokeStyle = "rgba(224, 242, 254, 0.65)";
          ctx.lineWidth = 1.6;
          for (let drop = 0; drop < 55; drop++) {
            const dx = ((drop * 67 + time * 180) % 840) - 20;
            const dy = ((drop * 43 + time * 520) % 480);
            ctx.beginPath();
            ctx.moveTo(dx, dy);
            ctx.lineTo(dx - 8, dy + 22);
            ctx.stroke();
          }
          break;

        case "regret":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: true, isFlooded: true });
          ctx.fillStyle = "rgba(14, 116, 144, 0.52)";
          ctx.beginPath();
          ctx.ellipse(400, 420, 320, 44, 0, 0, Math.PI * 2);
          ctx.fill();
          renderRealisticTrashClutter(ctx);
          renderRealisticRooster(ctx, 395, 372, 1.22, time, "sad", false);
          renderSpeechBubble(ctx, 395, 232, ["“Maafkan aku... kebiasaan", "kecilku merugikan semua.”"], "#64748b", "#ffffff");
          break;

        case "invitation":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: true });
          renderRealisticTrashBins(ctx, 645, 358, 0.95);
          renderRealisticRooster(ctx, 320, 378, 1.15, time, "sad", false);
          renderRealisticRabbit(ctx, 455, 380, 1.15, time, "advise", true);
          renderSpeechBubble(ctx, 470, 235, ["“Jangan sedih, Ayam Hitam!", "Ayo kita selamatkan sekolah!”"], "#10b981", "#ecfdf5");
          break;

        case "sorting_game":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 400, 375, 1.25);
          renderRealisticRooster(ctx, 225, 382, 1.1, time, "happy", false);
          renderRealisticRabbit(ctx, 575, 382, 1.1, time, "advise", true);
          renderSpeechBubble(ctx, 400, 238, ["ORGANIK (Hijau): Daun & Sisa Makanan", "ANORGANIK (Kuning): Plastik & Kaleng"], "#16a34a", "#ffffff");
          break;

        case "gotong_royong":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 660, 358, 0.95);
          renderRealisticRooster(ctx, 295, 378, 1.15, time, "work", false);
          renderRealisticRabbit(ctx, 445, 380, 1.15, time, "work", false);
          break;

        case "clean_again":
        case "moral_ending":
        case "reflection":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 615, 355, 0.95);
          renderRealisticRooster(ctx, 325, 378, 1.18, time, "happy", false);
          renderRealisticRabbit(ctx, 465, 380, 1.15, time, "happy", true);
          break;

        case "role_model":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          renderRealisticTrashBins(ctx, 635, 358, 1.0);
          renderRealisticRooster(ctx, 320, 378, 1.18, time, "proud", false);
          renderRealisticRabbit(ctx, 485, 380, 1.15, time, "happy", true);
          renderSpeechBubble(ctx, 325, 235, ["“Ayo buang sampah sesuai", "jenisnya, teman-teman!”"], "#16a34a", "#ecfdf5");
          break;

        case "pledge":
          renderPhotorealisticSchoolEnvironment(ctx, 800, 500, time, { isStorm: false, isDirty: false });
          // Spanduk Janji Kebersihan di Halaman Sekolah
          ctx.save();
          ctx.translate(400, 242);
          ctx.fillStyle = "#1e3a8a";
          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(-180, -26, 360, 48, 12);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#facc15";
          ctx.font = "800 11px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("JANJI SISWA SMPN SATU ATAP 3 KALIANDA", 0, -6);
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 10.5px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText("Disiplin Piket • Kurangi Plastik • Rawat Tanaman", 0, 11);
          ctx.restore();

          renderRealisticRooster(ctx, 325, 380, 1.15, time, "happy", false);
          renderRealisticRabbit(ctx, 465, 382, 1.15, time, "happy", true);
          break;
      }

      ctx.restore();
    }

    function startSceneAnimation(sceneName) {
      if (sceneAnimFrameId) {
        cancelAnimationFrame(sceneAnimFrameId);
        sceneAnimFrameId = null;
      }

      function loop(nowMs) {
        const canvas = document.getElementById("active-scene-canvas");
        if (!canvas) return;
        drawSceneFrame(canvas, sceneName, nowMs * 0.001);
        sceneAnimFrameId = requestAnimationFrame(loop);
      }
      sceneAnimFrameId = requestAnimationFrame(loop);
    }

              return `
                <div class="p-2 rounded-xl bg-white border border-slate-200 shadow-xs flex flex-col items-center gap-1.5">
                  <span class="text-xs font-bold text-slate-800">${item.icon} ${item.name}</span>
                  <div class="flex gap-1 w-full">
                    <button onclick="checkSortItem('${item.id}', 'organik', '${item.type}')"
                      class="flex-1 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold">
                      Organik
                    </button>
                    <button onclick="checkSortItem('${item.id}', 'anorganik', '${item.type}')"
                      class="flex-1 py-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-900 text-[10px] font-bold">
                      Anorganik
                    </button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function checkSortItem(id, chosen, correct) {
      if (chosen === correct) {
        sortedItems[id] = true;
        playChime("success");
        showToast(`Benar! Sampah masuk ke tempat sampah ${correct.toUpperCase()} 🎉`);
        renderCurrentPage();
      } else {
        playChime("error");
        showToast("Ups, coba periksa lagi jenis sampahnya ya! 🤔");
      }
    }

    /**
     * ============================================================================
     * ENGINE AUDIO: TEXT-TO-SPEECH (BAHASA INDONESIA), AUTO-PLAY & EFEK SUARA ALAM
     * ============================================================================
     */
    function initAudioContextSafe() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      } catch (err) {
        // Abaikan jika browser membatasi AudioContext
      }
    }

    function playChime(type = "page") {
      try {
        initAudioContextSafe();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "success") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === "error") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(165, now + 0.22);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else {
          // Efek lembut membalik halaman
          osc.type = "sine";
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.1);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);
        }
      } catch (err) {
        // Aman tanpa menghentikan alur aplikasi
      }
    }

    function toggleAmbientSound() {
      initAudioContextSafe();
      ambientEnabled = !ambientEnabled;
      const icon = document.getElementById("sfx-icon");
      const label = document.getElementById("sfx-label");

      if (ambientEnabled) {
        if (icon) icon.textContent = "🌿";
        if (label) label.textContent = "Alam Aktif";
        showToast("Efek suara lingkungan sekolah diaktifkan 🐦");
        startAmbientLoop();
      } else {
        if (icon) icon.textContent = "🔇";
        if (label) label.textContent = "Suara Alam";
        stopAmbientLoop();
        showToast("Efek suara lingkungan dimatikan");
      }
    }

    function startAmbientLoop() {
      stopAmbientLoop();
      const triggerAmbientCue = () => {
        if (!ambientEnabled) return;
        try {
          initAudioContextSafe();
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const page = STORY_PAGES[currentPageIndex];

          if (page && page.scene === "flood_rain") {
            // Efek rintik hujan lembut (filtered noise)
            const bufferSize = Math.floor(audioCtx.sampleRate * 0.8);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * 0.15;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.value = 1100;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.005, now + 0.8);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
          } else {
            // Kicauan burung sekolah yang asri
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            const baseFreq = 1850 + Math.random() * 650;
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, now + 0.18);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.03, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.24);
          }
        } catch (err) {
          // Abaikan error audio minor
        }
      };

      triggerAmbientCue();
      ambientInterval = setInterval(triggerAmbientCue, 2800);
    }

    function stopAmbientLoop() {
      if (ambientInterval) {
        clearInterval(ambientInterval);
        ambientInterval = null;
      }
    }

    function getNarrationTextForPage(page) {
      if (!page) return "";
      if (page.type === "cover") {
        return page.narration;
      }
      if (page.type === "reflection") {
        return `${page.title}. ${page.narration} Pertanyaan pertama: ${page.questions[0].q}. Pertanyaan kedua: ${page.questions[1].q}. Pertanyaan ketiga: ${page.questions[2].q}. Pertanyaan keempat: ${page.questions[3].q}. Pertanyaan kelima: ${page.questions[4].q}. Ayo ikuti juga tantangan Misi 7 Hari Sekolah Bersih!`;
      }
      let content = `Halaman ${page.page}. ${page.title}. ${page.text}`;
      if (page.moralQuote) {
        content += ` Pesan moral utama: ${page.moralQuote}`;
      }
      return content;
    }

    function updateTtsUi() {
      const ttsIcon = document.getElementById("tts-icon");
      const ttsLabel = document.getElementById("tts-label");
      const autoBtn = document.getElementById("btn-autoplay");
      const autoIcon = document.getElementById("autoplay-icon");
      const autoLabel = document.getElementById("autoplay-label");

      if (ttsIcon) ttsIcon.textContent = isSpeaking ? "⏹️" : "🔊";
      if (ttsLabel) ttsLabel.textContent = isSpeaking ? "Berhenti" : "Bacakan";

      if (autoBtn && autoIcon && autoLabel) {
        if (isAutoPlaying) {
          autoBtn.className = "flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-rose-600 hover:bg-rose-700 text-white shadow-md transition active:scale-95";
          autoIcon.textContent = "⏹️";
          autoLabel.textContent = `Stop (Hal ${currentPageIndex + 1}/15)`;
        } else {
          autoBtn.className = "flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white shadow-sm transition active:scale-95";
          autoIcon.textContent = "▶️";
          autoLabel.textContent = "Putar Otomatis";
        }
      }
    }

    function clearAutoTimers() {
      if (autoPlayTimer) {
        clearTimeout(autoPlayTimer);
        autoPlayTimer = null;
      }
      if (speechFallbackTimer) {
        clearTimeout(speechFallbackTimer);
        speechFallbackTimer = null;
      }
    }

    function stopNarration() {
      speechSessionId++;
      clearAutoTimers();
      isSpeaking = false;
      try {
        if ("speechSynthesis" in window && window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      } catch (err) {
        // Abaikan jika speechSynthesis tidak tersedia
      }
      updateTtsUi();
    }

    function stopAutoPlay(silent = false) {
      isAutoPlaying = false;
      stopNarration();
      if (!silent) {
        showToast("Mode Putar Otomatis dihentikan");
      }
    }

    function speakCurrentPage(onCompleteCallback = null) {
      stopNarration();
      const page = STORY_PAGES[currentPageIndex];
      const textToRead = getNarrationTextForPage(page);
      const currentSession = ++speechSessionId;

      isSpeaking = true;
      updateTtsUi();

      const handleSpeechFinished = () => {
        if (currentSession !== speechSessionId) return;
        clearAutoTimers();
        isSpeaking = false;
        updateTtsUi();
        if (typeof onCompleteCallback === "function") {
          onCompleteCallback();
        }
      };

      // Estimasi durasi baca cerdas sebagai fallback jika TTS tidak tersedia / macet
      const wordCount = textToRead.split(/\s+/).filter(Boolean).length;
      const estimatedMs = Math.max(4500, Math.min(28000, wordCount * 430 + 1800));

      try {
        if ("speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined") {
          const utterance = new SpeechSynthesisUtterance(textToRead);
          utterance.lang = "id-ID";
          utterance.rate = 0.96;
          utterance.pitch = 1.04;

          const voices = window.speechSynthesis.getVoices();
          const indoVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes("id"));
          if (indoVoice) {
            utterance.voice = indoVoice;
          }

          utterance.onend = () => handleSpeechFinished();
          utterance.onerror = () => handleSpeechFinished();

          // Fallback timer berjaga jika event onend tidak terpicu di browser tertentu
          speechFallbackTimer = setTimeout(() => {
            handleSpeechFinished();
          }, estimatedMs + 3500);

          window.speechSynthesis.speak(utterance);
        } else {
          // Perangkat tanpa Web Speech API tetap menjalankan auto-read dengan durasi baca alami
          speechFallbackTimer = setTimeout(() => {
            handleSpeechFinished();
          }, estimatedMs);
        }
      } catch (err) {
        speechFallbackTimer = setTimeout(() => {
          handleSpeechFinished();
        }, estimatedMs);
      }
    }

    function toggleNarration() {
      initAudioContextSafe();
      if (isAutoPlaying) {
        stopAutoPlay();
        return;
      }
      if (isSpeaking) {
        stopNarration();
      } else {
        speakCurrentPage();
      }
    }

    function runAutoPlayStep() {
      if (!isAutoPlaying) return;
      updateTtsUi();

      speakCurrentPage(() => {
        if (!isAutoPlaying) return;
        if (currentPageIndex < STORY_PAGES.length - 1) {
          autoPlayTimer = setTimeout(() => {
            if (!isAutoPlaying) return;
            currentPageIndex++;
            playChime("page");
            renderCurrentPage();
            window.scrollTo({ top: 0, behavior: "smooth" });
            runAutoPlayStep();
          }, 1200);
        } else {
          // Sampai di halaman terakhir (Halaman 15)
          isAutoPlaying = false;
          updateTtsUi();
          playChime("success");
          showToast("🎉 Cerita selesai dibacakan sampai halaman akhir!");
        }
      });
    }

    function toggleAutoPlay() {
      initAudioContextSafe();
      if (isAutoPlaying) {
        stopAutoPlay();
        return;
      }

      // Aktifkan juga suara alam jika belum aktif agar pengalaman bercerita semakin hidup
      if (!ambientEnabled) {
        ambientEnabled = true;
        const icon = document.getElementById("sfx-icon");
        const label = document.getElementById("sfx-label");
        if (icon) icon.textContent = "🌿";
        if (label) label.textContent = "Alam Aktif";
        startAmbientLoop();
      }

      isAutoPlaying = true;
      showToast(`▶️ Memutar otomatis dari Halaman ${currentPageIndex + 1} sampai selesai...`);
      runAutoPlayStep();
    }

    function startAutoPlayFromCover() {
      initAudioContextSafe();
      if (!ambientEnabled) {
        ambientEnabled = true;
        const icon = document.getElementById("sfx-icon");
        const label = document.getElementById("sfx-label");
        if (icon) icon.textContent = "🌿";
        if (label) label.textContent = "Alam Aktif";
        startAmbientLoop();
      }
      isAutoPlaying = true;
      showToast("▶️ Memulai cerita & pembacaan otomatis dari Halaman 1 sampai 15...");
      runAutoPlayStep();
    }

    /**
     * ============================================================================
     * NAVIGASI HALAMAN, DAFTAR ISI & REFLEKSI
     * ============================================================================
     */
    function goToPage(index, keepAutoPlay = false) {
      if (index < 0 || index >= STORY_PAGES.length) return;
      if (!keepAutoPlay && isAutoPlaying) {
        isAutoPlaying = false;
      }
      stopNarration();
      currentPageIndex = index;
      playChime("page");
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function nextPage() {
      if (currentPageIndex < STORY_PAGES.length - 1) {
        goToPage(currentPageIndex + 1);
      }
    }

    function prevPage() {
      if (currentPageIndex > 0) {
        goToPage(currentPageIndex - 1);
      }
    }

    function renderPageDots() {
      const container = document.getElementById("page-dots");
      container.innerHTML = STORY_PAGES.map((p, idx) => `
        <button onclick="goToPage(${idx})" title="Halaman ${p.page}: ${p.title}"
          class="h-2.5 rounded-full transition-all ${idx === currentPageIndex ? 'w-7 bg-emerald-600' : 'w-2.5 bg-slate-300 hover:bg-emerald-400'}">
        </button>
      `).join("");
    }

    function toggleHint(idx) {
      revealedHints[idx] = !revealedHints[idx];
      renderCurrentPage();
    }

    function toggleMissionDay(idx) {
      missionProgress[idx] = !missionProgress[idx];
      if (missionProgress[idx]) {
        playChime("success");
      }
      renderCurrentPage();
    }

    // Modal Daftar Isi
    function openTocModal() {
      const modal = document.getElementById("toc-modal");
      const list = document.getElementById("toc-list");
      list.innerHTML = STORY_PAGES.map((p, idx) => `
        <button onclick="goToPage(${idx}); closeTocModal();"
          class="text-left p-3 rounded-2xl border ${idx === currentPageIndex ? 'bg-emerald-50 border-emerald-500' : 'bg-slate-50 hover:bg-emerald-50/50 border-slate-200'} transition flex items-center gap-3">
          <span class="w-8 h-8 rounded-xl ${idx === currentPageIndex ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border border-slate-200'} font-extrabold text-xs flex items-center justify-center shrink-0">
            ${p.page}
          </span>
          <div class="min-w-0">
            <p class="text-[10px] font-bold text-emerald-700 uppercase">${p.badge}</p>
            <p class="text-sm font-bold text-slate-800 truncate">${p.title}</p>
          </div>
        </button>
      `).join("");
      modal.classList.remove("hidden");
    }

    function closeTocModal() {
      document.getElementById("toc-modal").classList.add("hidden");
    }

    /**
     * ============================================================================
     * MODAL KUIS INTERAKTIF
     * ============================================================================
     */
    function openQuizModal() {
      renderQuizContent();
      document.getElementById("quiz-modal").classList.remove("hidden");
    }

    function closeQuizModal() {
      document.getElementById("quiz-modal").classList.add("hidden");
    }

    function selectQuizOption(qIdx, optIdx) {
      if (quizSubmitted) return;
      quizAnswers[qIdx] = optIdx;
      renderQuizContent();
    }

    function submitQuiz() {
      if (Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length) {
        showToast("Silakan jawab semua 5 pertanyaan terlebih dahulu ya!");
        return;
      }
      quizSubmitted = true;
      playChime("success");
      renderQuizContent();
    }

    function resetQuiz() {
      quizAnswers = {};
      quizSubmitted = false;
      renderQuizContent();
    }

    function renderQuizContent() {
      const container = document.getElementById("quiz-content");
      let score = 0;
      if (quizSubmitted) {
        QUIZ_QUESTIONS.forEach((q, idx) => {
          if (quizAnswers[idx] === q.correct) score += 20;
        });
      }

      container.innerHTML = `
        ${quizSubmitted ? `
          <div class="mb-6 p-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-center shadow-md">
            <p class="text-xs uppercase tracking-widest font-bold text-emerald-100">Hasil Kuis Pemahaman Cerita</p>
            <p class="text-4xl font-extrabold my-1">Nilai: ${score} / 100</p>
            <p class="text-sm font-medium">
              ${score >= 80 ? "Luar biasa! Kamu sangat memahami pesan menjaga kebersihan sekolah! 🌟" : "Bagus! Yuk baca kembali ceritanya agar semakin paham! 💪"}
            </p>
          </div>
        ` : ""}

        <div class="space-y-5">
          ${QUIZ_QUESTIONS.map((q, qIdx) => `
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
              <p class="font-bold text-slate-900 text-sm sm:text-base mb-3">${qIdx + 1}. ${q.question}</p>
              <div class="space-y-2">
                ${q.options.map((opt, optIdx) => {
                  const isSelected = quizAnswers[qIdx] === optIdx;
                  let btnStyle = "bg-white border-slate-200 text-slate-700 hover:border-indigo-400";
                  if (quizSubmitted) {
                    if (optIdx === q.correct) {
                      btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 font-bold";
                    } else if (isSelected && optIdx !== q.correct) {
                      btnStyle = "bg-rose-100 border-rose-500 text-rose-950";
                    }
                  } else if (isSelected) {
                    btnStyle = "bg-indigo-50 border-indigo-600 text-indigo-950 font-bold";
                  }

                  return `
                    <button onclick="selectQuizOption(${qIdx}, ${optIdx})"
                      class="w-full text-left p-3 rounded-xl border text-xs sm:text-sm transition flex items-center justify-between ${btnStyle}">
                      <span>${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                      ${quizSubmitted && optIdx === q.correct ? "<span>✅</span>" : ""}
                      ${quizSubmitted && isSelected && optIdx !== q.correct ? "<span>❌</span>" : ""}
                    </button>
                  `;
                }).join("")}
              </div>
              ${quizSubmitted ? `
                <p class="mt-2.5 text-xs text-slate-600 bg-white p-2.5 rounded-xl border border-slate-200">
                  <strong>Penjelasan:</strong> ${q.explanation}
                </p>
              ` : ""}
            </div>
          `).join("")}
        </div>

        <div class="mt-6 flex justify-end gap-3">
          ${quizSubmitted ? `
            <button onclick="resetQuiz()" class="px-5 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm">
              Ulangi Kuis
            </button>
          ` : `
            <button onclick="submitQuiz()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-extrabold text-sm shadow-md">
              Periksa Jawaban
            </button>
          `}
        </div>
      `;
    }

    /**
     * TOAST NOTIFIKASI HALUS
     */
    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById("toast-box");
      const text = document.getElementById("toast-msg");
      text.textContent = msg;
      box.classList.remove("opacity-0");
      box.classList.add("opacity-100");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove("opacity-100");
        box.classList.add("opacity-0");
      }, 2800);
    }

    // Dukungan Navigasi Keyboard (Panah Kiri & Kanan)
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowRight") nextPage();
      if (e.key === "ArrowLeft") prevPage();
    });

    // Inisialisasi Halaman Pertama saat Dokumen Dimuat
    window.onload = function () {
      renderCurrentPage();
    };
  </script>
</body>
</html>
